[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privcred-orchestrator"
version = "0.2.0"
description = "PoppyOrchestrator AgentApp — federated provider credentialing claims on Flower SuperGrid (synthetic MVP)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
  # Flower Agent runtime — required for SuperGrid / flwr run.
  # Dry-run script works without flwr installed (stdlib + fixtures only).
  "flwr>=1.39.0,<1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["poppy_orchestrator"]

[tool.flwr.app]
publisher = "leanlabiano"
display-name = "PrivCred PoppyOrchestrator"
fab-format-version = 1
flwr-version-target = "1.39.0"
# AgentApp-only FAB — do NOT add serverapp/clientapp (Flower docs).
fab-include = [
  "poppy_orchestrator/**/*.py",
  "schemas/**/*.json",
  "LICENSE",
]

[tool.flwr.app.components]
agentapp = "poppy_orchestrator.agent_app:app"

[tool.flwr.app.config]
# Default kickoff — override with --run-config on flwr run / chat
provider-id = "SYNTH-NPI-1999999999"
network-id = "SYNTH-NETWORK-X"
fixture-mode = "true"
hitl-auto-approve-dry-run = "false"  # Flower Chat requires an explicit review command
grid-handoff = "true"  # F0: agent.grid sample/message between ≥2 roles
grid-pull-timeout = "120"  # SuperNode cold start; Grid allows up to 300
grid-wait-budget = "240"  # all Grid waits in one run; SuperGrid stops a task at 300
review-max-age-seconds = 600
endeavor-optional = "true"  # F11 bonus — dry-run without FLWR_RUNTIME_* / ENDEAVOR_API_KEY
endeavor-role = "PoppyOrchestrator"
# Model the Orchestrator asks for its brief. "flower/endeavor" is a guess:
# confirm the exact id in Slack. Override per run with
#   --run-config 'endeavor-model-id="<id>"'
endeavor-model-id = "flower/endeavor"

[tool.flwr.app.config.agent]
input = "Credential synthetic provider SYNTH-NPI-1999999999 for network SYNTH-NETWORK-X"
