# Two SuperNodes for the RushPoppy demo, each with its own data and its own
# model provider. Synthetic data only.
#
# Adapted from the official example:
#   https://github.com/jafermarq/flower-collaborative-agent-hackathon
#
# Before `docker compose up`:
#   1. keys/supernode-hospital and keys/supernode-payer exist and both public
#      keys are registered on SuperGrid with the exact names HospitalCred and
#      PayerEnrollment (see docs/f16-node-models.md).
#   2. The variables below are set in your shell or in a local .env file.
#      Never commit keys.
#
# Not run by the author: no Docker and no provider keys on the machine that
# wrote it. Treat as a starting point and check it once before the demo.

services:
  hospital:
    image: flwr/supernode:1.39.0
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-hospital
      - --allow-runtime-dependency-installation
      - '--node-config=poppy-role="HospitalCred" poppy-data="/data/providers.json" poppy-model="${HOSPITAL_MODEL:?Set HOSPITAL_MODEL to a model id served by the hospital provider}"'
    environment:
      # HospitalCred runs on Nebius Token Factory.
      FLWR_MODEL_API_ENDPOINT: https://api.tokenfactory.tf-ca1.nebius.com/v1/responses
      FLWR_MODEL_API_KEY: ${NEBIUS_API_KEY:?Set NEBIUS_API_KEY (shared in the hackathon Slack)}
    volumes:
      - ./keys:/keys:ro
      - ./fixtures/supernodes/HospitalCred:/data:ro

  payer:
    image: flwr/supernode:1.39.0
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-payer
      - --allow-runtime-dependency-installation
      - '--node-config=poppy-role="PayerEnrollment" poppy-data="/data/providers.json" poppy-model="${PAYER_MODEL:?Set PAYER_MODEL to a model id served by Flower AI}"'
    environment:
      # PayerEnrollment runs on Flower AI (no endpoint override).
      FLWR_MODEL_API_KEY: ${FLOWER_API_KEY:?Set FLOWER_API_KEY (flower.ai, Profile, Settings, API Keys)}
    volumes:
      - ./keys:/keys:ro
      - ./fixtures/supernodes/PayerEnrollment:/data:ro
